openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mockups
    description: Mockup set manifests generated by the /human-mockups skill
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /mockup-sets:
    get:
      operationId: listMockupSets
      tags: [mockups]
      summary: List mockup sets
      description: >-
        Every mockup set across the daemon's registered projects, newest
        first. A slug claimed by two projects resolves to the first — the
        slug is the URL key and cannot be served unambiguously.
      responses:
        "200":
          description: The sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MockupSet"
  /mockup-sets/{slug}:
    get:
      operationId: getMockupSet
      tags: [mockups]
      summary: Get one mockup set
      description: >-
        One set's manifest plus the directory it lives in — the daemon's file
        middleware serves the option HTML from that directory, and the client
        needs the mapping to build those URLs.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The set and its directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockupSetDetail"
        "404":
          description: No scanned project claims the slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MockupOption:
      type: object
      properties:
        n:
          type: integer
        name:
          type: string
        file:
          type: string
        description:
          type: string
      required:
        - n
        - name
        - file
    MockupSet:
      type: object
      properties:
        feature:
          type: string
        slug:
          type: string
        created:
          type: string
        project:
          type: string
        ticket:
          type: string
        parent:
          type: string
        parentFile:
          type: string
        instructions:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/MockupOption"
      required:
        - feature
        - slug
        - created
        - options
    MockupSetDetail:
      type: object
      properties:
        set:
          $ref: "#/components/schemas/MockupSet"
        dir:
          type: string
      required:
        - set
        - dir

